<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arnav Sharma's Cloud & DevOps Portfolio">
    <title>Arnav Sharma | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-glow: rgba(56, 189, 248, 0.3);
            --accent-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated background gradient blobs */
        .blob-1, .blob-2 {
            position: absolute;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s ease-in-out infinite alternate;
        }

        .blob-1 {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            top: -10%;
            left: -10%;
        }

        .blob-2 {
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            width: 30vw;
            height: 30vw;
            border-radius: 50%;
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .container {
            max-width: 800px;
            width: 90%;
            padding: 3rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }

        .subtitle {
            color: var(--accent-color);
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .projects-grid {
            display: grid;
            gap: 1.5rem;
        }

        .project-card {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            group: hover;
        }

        .project-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, var(--accent-glow), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .project-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .project-card:hover::before {
            transform: translateX(100%);
        }

        .project-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            margin-right: 1.5rem;
            flex-shrink: 0;
        }

        .project-content {
            flex-grow: 1;
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .arrow {
            color: var(--text-muted);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .project-card:hover .arrow {
            transform: translateX(5px);
            color: var(--accent-color);
        }

        @media (max-width: 640px) {
            .container {
                padding: 2rem;
            }
            .project-card {
                flex-direction: column;
                text-align: center;
            }
            .project-icon {
                margin: 0 0 1rem 0;
            }
            .arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    
    <div class="container">
        <header>
            <h1>Arnav Sharma</h1>
            <p class="subtitle">Cloud & DevOps Portfolio</p>
        </header>
        
        <main>
            <h2 class="section-title">Projects</h2>
            <div class="projects-grid">
                <a href="https://hypnoticshield.github.io/Containerization_DevOps/" class="project-card">
                    <div class="project-icon">
                        <!-- Container Icon -->
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                    </div>
                    <div class="project-content">
                        <div class="project-title">Docker & Containerization Labs</div>
                        <div class="project-desc">A comprehensive collection of hands-on experiments exploring Docker, Swarm, and Kubernetes orchestration.</div>
                    </div>
                    <div class="arrow">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </div>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
